<html lang="en-GB">
<head>

  <style>
:root{--ink:#172033;--muted:#7b8494;--bg:#f5f2ec;--card:#fffdf9;--navy:#17263f;--navy2:#223451;--sage:#a8b79e;--sage2:#dce5d7;--sand:#ead9bf;--line:#e7e2d9;--red:#b95d58;--green:#47745e;--shadow:0 14px 40px rgba(33,40,52,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(92px + env(safe-area-inset-bottom))}.wrap,.content{max-width:820px;margin:auto}.app-header{background:var(--navy);color:#fff;padding:24px 18px 30px;border-radius:0 0 34px 34px}.header-top{display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,#a8b79e,#758c79);color:#17263f;display:grid;place-items:center;font-size:23px;box-shadow:0 8px 20px #0002}.brand h1{font-size:19px;line-height:1.1;margin:0;letter-spacing:-.4px}.brand p{margin:5px 0 0;color:#bdc7d4;font-size:12px}.month-row{display:flex;justify-content:space-between;align-items:end;margin-top:28px;gap:12px}.month-row h2{font-size:13px;margin:0;color:#aeb9c8;text-transform:uppercase;letter-spacing:1.4px}.month-row input{max-width:155px;background:#ffffff10;color:#fff;border:1px solid #ffffff2b;border-radius:12px;padding:9px 10px;color-scheme:dark}.content{padding:20px 16px}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:-2px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:17px;box-shadow:var(--shadow)}.metric-label{font-size:11px;color:var(--muted);font-weight:750;text-transform:uppercase;letter-spacing:.9px}.metric{font-size:clamp(21px,5vw,29px);font-weight:800;letter-spacing:-1px;margin:6px 0 2px;overflow-wrap:anywhere}.metric-note{font-size:11px;color:var(--muted)}.hero-card{margin-top:12px;background:var(--navy);color:#fff;border:0;padding:21px}.hero-card .metric-label,.hero-card .metric-note{color:#b9c4d2}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:25px 2px 12px}.section-head h2{font-size:18px;margin:0;letter-spacing:-.3px}.link-btn{border:0;background:none;color:var(--green);font-weight:800;padding:5px}.progress{height:9px;border-radius:99px;background:#e8e4dc;overflow:hidden;margin:13px 0 7px}.progress span{display:block;height:100%;background:var(--sage);border-radius:99px}.progress.over span{background:var(--red)}.budget-row,.tx-row{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid var(--line)}.budget-row:last-child,.tx-row:last-child{border-bottom:0}.cat-icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex-shrink:0;font-size:19px}.row-main{flex:1;min-width:0}.row-main strong{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row-main small{color:var(--muted);font-size:12px}.row-amount{text-align:right;white-space:nowrap;font-weight:800;font-size:14px}.row-amount small{display:block;font-size:11px;color:var(--muted);font-weight:500}.positive{color:var(--green)}.negative{color:var(--red)}.primary{border:0;border-radius:13px;background:var(--navy);color:#fff;font-weight:750;padding:12px 16px;min-height:45px}.secondary{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:13px;padding:10px 13px;font-weight:700}.danger{border:1px solid #edc9c6;color:var(--red);background:#fff7f6;border-radius:12px;padding:10px 13px;font-weight:700}.fab{position:fixed;right:max(20px,calc((100vw - 780px)/2));bottom:calc(96px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:19px;background:var(--sage);color:var(--navy);border:0;font-size:29px;box-shadow:0 12px 28px #24314a33;z-index:5}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffdf9ee;backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:6}.nav button{border:0;background:none;color:#8b929d;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px 0}.nav button span{font-size:19px;line-height:1.1}.nav button.active{color:var(--navy);font-weight:850}.page-title{font-size:25px;margin:7px 0 4px;letter-spacing:-.8px}.subtext{margin:0;color:var(--muted);font-size:13px}.toolbar{display:flex;gap:8px;align-items:center;margin:16px 0;flex-wrap:wrap}.toolbar input,.toolbar select{flex:1;min-width:130px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-weight:750;font-size:13px}.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;padding:12px;border:1px solid #d9d4cb;border-radius:12px;background:#fffdf9;color:var(--ink);min-height:46px}.field textarea{min-height:76px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-backdrop{position:fixed;inset:0;background:#172033a8;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:0}.modal{background:var(--bg);width:100%;max-width:620px;max-height:92dvh;overflow:auto;border-radius:28px 28px 0 0;padding:21px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -14px 40px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.modal-head h2{margin:0;font-size:21px}.close-btn{width:36px;height:36px;border:0;background:#e9e5dd;border-radius:12px;font-size:21px}.modal-actions{display:flex;gap:9px;margin-top:18px}.modal-actions>*{flex:1}.hidden{display:none!important}.pill{display:inline-flex;padding:5px 9px;border-radius:99px;background:var(--sage2);color:#365442;font-size:11px;font-weight:800}.empty{text-align:center;padding:32px 15px;color:var(--muted)}.empty .emoji{font-size:34px}.empty strong{display:block;color:var(--ink);margin:8px}.chart{display:flex;align-items:end;gap:10px;height:170px;padding:15px 4px 0;border-bottom:1px solid var(--line)}.bar-wrap{flex:1;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:7px;min-width:0}.bar{width:min(34px,75%);background:linear-gradient(180deg,#a8b79e,#647d69);border-radius:8px 8px 2px 2px;min-height:3px}.bar-label,.bar-value{font-size:10px;color:var(--muted)}.bar-value{white-space:nowrap}.category-line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);gap:10px;font-size:13px}.category-line:last-child{border:0}.notice{background:#fbf0d9;border:1px solid #ead8ad;border-radius:14px;padding:12px;font-size:12px;color:#765a22;margin:12px 0}.success-note{background:#e4eee5;border-radius:12px;padding:12px;color:#365c44;font-size:13px;margin:10px 0}.settings-block{margin:14px 0}.settings-block h3{font-size:15px;margin:0 0 8px}.setting-line{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.setting-line:last-child{border:0}.setting-line small{display:block;color:var(--muted);font-size:12px}.tiny{font-size:11px;color:var(--muted)}.inline-edit{display:flex;gap:8px;align-items:center}.inline-edit input{width:110px;padding:9px;border:1px solid var(--line);border-radius:10px}.person-chip{display:inline-block;background:#e7ecf4;color:#405471;border-radius:8px;padding:3px 7px;font-size:11px;font-weight:750;margin-top:4px}.split-hero{background:linear-gradient(135deg,#e5eadf,#f8f3e9);border:0}.split-hero .metric{color:var(--navy)}.person-hero{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:6px 0 18px}.person-avatar{width:58px;height:58px;border-radius:20px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:850;letter-spacing:.5px;box-shadow:var(--shadow)}
@media(min-width:600px){.app-header{border-radius:0 0 38px 38px;padding:28px 26px 32px}.content{padding:25px 22px}.modal-backdrop{align-items:center;padding:20px}.modal{border-radius:28px}.fab{bottom:104px}.summary-grid{grid-template-columns:repeat(4,1fr)}.metric{font-size:23px}}
  </style>

<body>
<header class="app-header"><div class="wrap"><div class="header-top"><div class="brand"><div class="logo">✦</div><div><h1>Our Money</h1><p>A clearer view of your household finances</p></div></div><button class="secondary" id="headerAdd" style="background:#ffffff12;border-color:#ffffff35;color:white">＋ Add</button></div><div class="month-row"><h2 id="headerMonth">This month</h2><input id="monthPicker" type="month" aria-label="Choose month"></div></div></header>
<main id="app" class="content"></main>
<button class="fab" id="fab" aria-label="Add transaction">＋</button>
<nav class="nav" aria-label="Main navigation"><button data-page="me" class="active"><span>◉</span>Me</button><button data-page="wife"><span>◉</span>Wife</button><button data-page="household"><span>⌂</span>Household</button><button data-page="settlement"><span>⇄</span>Settlement</button><button data-page="settings"><span>⚙</span>Settings</button></nav>
<div id="modalRoot"></div>
<script>
(()=>{
'use strict';
const KEY='householdExpenseTracker.v1';
const defaultCategories=[
 {name:'Groceries',icon:'🛒',color:'#e2f5ed',budget:450},{name:'Household bills',icon:'🏠',color:'#e9e7ff',budget:500},{name:'Eating out',icon:'🍽️',color:'#fff0dc',budget:180},{name:'Transport',icon:'🚗',color:'#e0f2fb',budget:220},{name:'Shopping',icon:'🛍️',color:'#fbe5ec',budget:150},{name:'Health',icon:'💊',color:'#e8f5df',budget:80},{name:'Subscriptions',icon:'📺',color:'#e9edf4',budget:60},{name:'Pets',icon:'🐾',color:'#fff2d5',budget:80},{name:'Leisure',icon:'🎟️',color:'#f0e6ff',budget:120},{name:'Other',icon:'✳️',color:'#edf1f3',budget:100}
];
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const monthISO=()=>todayISO().slice(0,7);
const initial=()=>({version:5,people:['Me','Partner'],categories:defaultCategories.map(x=>({...x,name:x.name,budget:x.name==='Groceries'?500:x.budget})),transactions:[],budgetsMonth:monthISO(),incomes:{me:0,partner:0,rent:0,groundMaintenanceQuarterly:0},bills:[],personalBills:[],groceryBudget:500,reimbursements:{},personalBudgets:{me:[],partner:[]}});
let state=load();let page='me';let editingId=null;let filters={search:'',category:'all',person:'all',type:'all'};let reportMonth=monthISO();
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&(v.version===1||v.version===2||v.version===3||v.version===4||v.version===5)&&Array.isArray(v.transactions)&&Array.isArray(v.categories)){v.version=5;v.incomes=v.incomes||{me:0,partner:0,rent:0,groundMaintenanceQuarterly:0};if(v.incomes.groundMaintenanceQuarterly==null)v.incomes.groundMaintenanceQuarterly=Math.max(0,Number(v.incomes.propertyCosts)||0)*3;delete v.incomes.propertyCosts;v.bills=Array.isArray(v.bills)?v.bills:[];v.personalBills=Array.isArray(v.personalBills)?v.personalBills:[];v.groceryBudget=500;v.reimbursements=v.reimbursements&&typeof v.reimbursements==='object'?v.reimbursements:{};const defaults=v.categories.filter(c=>c.name!=='Groceries'&&c.name!=='Household bills').map((c,i)=>({id:'b'+i,name:c.name,icon:c.icon||'✳️',budget:Number(c.budget)||0}));if(!v.personalBudgets||Array.isArray(v.personalBudgets)){v.personalBudgets={me:defaults.map(x=>({...x})),partner:defaults.map(x=>({...x}))}}else{for(const k of ['me','partner']){if(!Array.isArray(v.personalBudgets[k])){const old=Number(v.personalBudgets[k])||0;v.personalBudgets[k]=defaults.map(x=>({...x,budget:x.name==='Other'?old:x.budget}))}}}v.transactions.forEach(t=>{if(!t.scope)t.scope=t.category==='Groceries'||t.category==='Household bills'?'shared':'personal'});return v}}catch(e){}return initial()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('Your browser could not save this change. Please export a backup and free some device storage.');return false}}
const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cat=n=>state.categories.find(c=>c.name===n)||{name:n||'Other',icon:'✳️',color:'#edf1f3',budget:0};
const monthName=m=>new Date(`${m}-01T12:00:00`).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
const fmtDate=s=>new Date(`${s}T12:00:00`).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const monthTx=(m=monthISO())=>state.transactions.filter(t=>t.date?.startsWith(m));
const total=(tx,type)=>tx.filter(t=>!type||t.type===type).reduce((a,t)=>a+Number(t.amount||0),0);
function setPage(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function updateHeader(){const m=document.getElementById('monthPicker').value||monthISO();document.getElementById('headerMonth').textContent=monthName(m);}
function render(){updateHeader();const app=document.getElementById('app');if(page==='me')app.innerHTML=personPage('me');else if(page==='wife')app.innerHTML=personPage('partner');else if(page==='household')app.innerHTML=householdNewPage();else if(page==='settlement')app.innerHTML=settlementPage();else app.innerHTML=settingsPage();bindDynamic();}
function homePage(){const m=document.getElementById('monthPicker').value||monthISO(),tx=monthTx(m),spent=total(tx,'expense'),income=total(tx,'income'),net=income-spent,budget=state.categories.reduce((s,c)=>s+Number(c.budget||0),0),remaining=budget-spent,expenses=tx.filter(t=>t.type==='expense');const byCat=state.categories.map(c=>({...c,spent:total(expenses.filter(t=>t.category===c.name))})).filter(c=>c.spent>0).sort((a,b)=>b.spent-a.spent).slice(0,5);const recent=[...tx].sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt).slice(0,5);return `
 <div class="summary-grid"><div class="card"><div class="metric-label">Spent this month</div><div class="metric">${money(spent)}</div><div class="metric-note">Household expenses</div></div><div class="card"><div class="metric-label">Money in</div><div class="metric positive">${money(income)}</div><div class="metric-note">Income recorded</div></div><div class="card"><div class="metric-label">Budget left</div><div class="metric ${remaining<0?'negative':''}">${money(remaining)}</div><div class="metric-note">Of ${money(budget)} total</div></div><div class="card"><div class="metric-label">Net recorded</div><div class="metric ${net<0?'negative':'positive'}">${money(net)}</div><div class="metric-note">Income minus spending</div></div></div>
 <div class="section-head"><h2>Household monthly summary</h2><button class="link-btn" data-goto="household">Manage →</button></div><div class="card"><div class="summary-grid" style="margin:0"><div><div class="metric-label">${esc(state.people[0]||'You')} salary</div><div class="metric">${money(splitData(m).me)}</div></div><div><div class="metric-label">${esc(state.people[1]||'Your wife')} salary</div><div class="metric">${money(splitData(m).partner)}</div></div><div><div class="metric-label">Net rental income</div><div class="metric">${money(splitData(m).netRent)}</div></div><div><div class="metric-label">Recurring bills</div><div class="metric">${money(splitData(m).billsGross)}</div></div></div><div class="setting-line"><div><strong>Shared groceries</strong><small>Fixed monthly budget</small></div><div class="row-amount">${money(splitData(m).grocerySpent)}<small>${money(splitData(m).groceryLeft)} left</small></div></div><div class="setting-line"><div><strong>${esc(state.people[0]||'Your')} estimated disposable income</strong><small>After shared contributions, personal recurring bills and logged personal spending</small></div><div class="row-amount ${splitData(m).meDisposable<0?'negative':'positive'}">${money(splitData(m).meDisposable)}</div></div><div class="setting-line"><div><strong>${esc(state.people[1]||'Your wife')}'s estimated disposable income</strong><small>After shared contributions, personal recurring bills and logged personal spending</small></div><div class="row-amount ${splitData(m).partnerDisposable<0?'negative':'positive'}">${money(splitData(m).partnerDisposable)}</div></div><div class="success-note"><div class="metric-label">Monthly settlement</div><div class="metric">${money(Math.abs(splitData(m).partnerOwes))}</div><div class="metric-note">${splitData(m).partnerOwes>=0?esc(state.people[1]||'Your wife')+' owes '+esc(state.people[0]||'you'):'You owe '+esc(state.people[1]||'your wife')}</div></div><p class="tiny">Disposable income is an estimate using the monthly salary figures, current bill and grocery records, personal recurring bills and personal transactions entered in the app. It is not a bank balance.</p></div>
 <div class="card hero-card"><div class="section-head" style="margin:0 0 5px"><h2>Monthly budget</h2><span class="pill">${budget?Math.round(spent/budget*100):0}% used</span></div><div class="progress ${spent>budget?'over':''}"><span style="width:${Math.min(100,budget?spent/budget*100:0)}%"></span></div><div style="display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)"><span>${money(spent)} spent</span><span>${money(Math.max(0,remaining))} left</span></div></div>
 <div class="section-head"><h2>Spending by category</h2><button class="link-btn" data-goto="budgets">Budgets →</button></div><div class="card">${byCat.length?byCat.map(c=>`<div class="budget-row"><div class="cat-icon" style="background:${c.color}">${c.icon}</div><div class="row-main"><strong>${esc(c.name)}</strong><small>${c.budget?Math.round(c.spent/c.budget*100)+'% of '+money(c.budget):'No budget set'}</small><div class="progress ${c.spent>c.budget&&c.budget?'over':''}" style="margin:6px 0 0"><span style="width:${Math.min(100,c.budget?c.spent/c.budget*100:0)}%"></span></div></div><div class="row-amount">${money(c.spent)}</div></div>`).join(''):'<div class="empty"><div class="emoji">🧾</div><strong>No spending recorded yet</strong>Add your first expense to see your breakdown.</div>'}</div>
 <div class="section-head"><h2>Recent activity</h2><button class="link-btn" data-goto="transactions">See all →</button></div><div class="card">${recent.length?recent.map(txRow).join(''):'<div class="empty"><div class="emoji">👋</div><strong>Start tracking together</strong>Tap the + button to add an expense or income.</div>'}</div>`}
function txRow(t){const c=cat(t.category);return `<div class="tx-row"><div class="cat-icon" style="background:${c.color}">${t.type==='income'?'💷':c.icon}</div><div class="row-main"><strong>${esc(t.description||t.category)}</strong><small>${esc(t.category)} · ${fmtDate(t.date)} · ${esc(t.person||'Me')} · ${t.scope==='shared'?'Shared':'Personal'}</small></div><div class="row-amount ${t.type==='income'?'positive':''}">${t.type==='income'?'+':'−'}${money(t.amount)}<small>${esc(t.method||'')}</small></div><button class="link-btn" data-edit="${t.id}" aria-label="Edit transaction">···</button></div>`}
function personPage(who){const m=document.getElementById('monthPicker').value||monthISO(),d=splitData(m),i=state.incomes||{},isMe=who==='me',name=state.people[isMe?0:1]||(isMe?'You':'Wife'),salary=isMe?d.me:d.partner,personalBills=isMe?d.personalBillTotals.me:d.personalBillTotals.partner,personalSpent=isMe?d.mePersonalSpent:d.partnerPersonalSpent,personalBudget=isMe?d.mePersonalBudget:d.partnerPersonalBudget,pct=isMe?d.mePct:d.partnerPct,sharedBillShare=isMe?d.meBillShare:d.partnerBillShare,sharedGroceryShare=isMe?d.meGroceryShare:d.partnerGroceryShare,disposable=isMe?d.meDisposable:d.partnerDisposable,rent=isMe?Number(i.rent)||0:0;const bills=state.personalBills.filter(b=>(b.person==='partner')===!isMe);const key=isMe?'me':'partner';const items=Array.isArray(state.personalBudgets?.[key])?state.personalBudgets[key]:[];const personalTx=monthTx(m).filter(t=>t.type==='expense'&&t.scope==='personal'&&t.person===state.people[isMe?0:1]);return `<div class="person-hero"><div><div class="metric-label">${esc(name)} · ${monthName(m)}</div><h1 class="page-title">My money</h1><p class="subtext">Your income, personal recurring outgoings and individual budgets stay separate from household finances.</p></div><div class="person-avatar">${isMe?'ME':'W'}</div></div><div class="summary-grid"><div class="card"><div class="metric-label">Monthly income</div><div class="metric positive">${money(salary)}</div><div class="metric-note">Take-home salary</div></div><div class="card"><div class="metric-label">Disposable estimate</div><div class="metric">${money(disposable)}</div><div class="metric-note">After personal + shared costs</div></div></div>${isMe?`<div class="card" style="margin-top:12px"><div class="section-head" style="margin:0 0 8px"><h2>Rental income</h2></div><form id="incomeForm"><div class="form-grid"><div class="field"><label for="incomeMe">My monthly income (£)</label><input id="incomeMe" type="number" min="0" step="1" value="${Number(i.me)||0}"></div><div class="field"><labe ng>${esc(n2)}'s share of household bills</strong><small>${(d.partnerPct*100).toFixed(1)}% of ${money(d.billBalance)}</small></div><div class="row-amount">${money(d.partnerBillShare)}</div></div><div class="setting-line"><div><strong>${esc(n2)}'s share of groceries</strong><small>${(d.partnerPct*100).toFixed(1)}% of the fixed £500</small></div><div class="row-amount">${money(d.partnerGroceryShare)}</div></div><div class="setting-line"><div><strong>Groceries actually paid by ${esc(n2)}</strong><small>Full monthly grocery payment</small></div><div class="row-amount">−${money(500)}</div></div><div class="setting-line"><div><strong>Grocery credit to ${esc(n2)}</strong><small>Amount she paid above her percentage share</small></div><div class="row-amount positive">${money(d.wifeGroceryCredit)}</div></div><div class="field"><label for="partnerTransfer">Additional transfers already paid to ${esc(n1)} (£)</label><input id="partnerTransfer" type="number" min="0" step="0.01" value="${d.partnerTransfers}"></div><button class="primary" id="saveSettlement" style="width:100%">Save monthly transfer</button><div class="success-note" style="margin-top:14px"><div class="metric-label">${d.partnerOwes>=0?esc(n2)+' owes '+esc(n1):esc(n1)+' owes '+esc(n2)}</div><div class="metric">${money(Math.abs(d.partnerOwes))}</div><div class="metric-note">${monthName(m)} settlement</div></div></div><div class="section-head"><h2>How the calculation works</h2></div><div class="card"><div class="category-line"><span>1. Net rent</span><strong>${money(d.netRent)}</strong></div><div class="category-line"><span>2. Rent reduces household bills</span><strong>${money(d.rentApplied)}</strong></div><div class="category-line"><span>3. Remaining bills split by salary</span><strong>${(d.mePct*100).toFixed(1)}% / ${(d.partnerPct*100).toFixed(1)}%</strong></div><div class="category-line"><span>4. £500 groceries split by income</span><strong>${money(d.partnerGroceryShare)} wife / ${money(d.meGroceryShare)} you</strong> function transactionsPage(){const m=document.getElementById('monthPicker').value||monthISO();let tx=monthTx(m).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt);if(filters.search)tx=tx.filter(t=>(t.description+' '+t.category+' '+(t.notes||'')).toLowerCase().includes(filters.search.toLowerCase()));if(filters.category!=='all')tx=tx.filter(t=>t.category===filters.category);if(filters.person!=='all')tx=tx.filter(t=>t.person===filters.person);if(filters.type!=='all')tx=tx.filter(t=>t.type===filters.type);return `<h1 class="page-title">Activity</h1><p class="subtext">All household transactions for ${monthName(m)}.</p><div class="toolbar"><input id="txSearch" placeholder="Search transactions" value="${esc(filters.search)}"/><select id="txType"><option value="all">All types</option><option value="expense" ${filters.type==='expense'?'selected':''}>Expenses</option><option value="income" ${filters.type==='income'?'selected':''}>Income</option></select></div><div class="toolbar" style="margin-top:-7px"><select id="txCategory"><option value="all">All categories</option>${state.categories.map(c=>`<option ${filters.category===c.name?'selected':''}>${esc(c.name)}</option>`).join('')}</select><select id="txPerson"><option value="all">Everyone</option>${state.people.map(p=>`<option ${filters.person===p?'selected':''}>${esc(p)}</option>`).join('')}</select></div><div class="card"><div class="metric-label">${tx.length} transaction${tx.length===1?'':'s'} · ${money(total(tx,'expense'))} expenses</div>${tx.length?tx.map(txRow).join(''):'<div class="empty"><div class="emoji">🔎</div><strong>No matching transactions</strong>Try another search or add a transaction.</div>'}</div><div class="tiny" style="margin-top:12px">Tap ··· beside a transaction to edit or delete it.</div>`}

function rentalNet(){const quarterly=Math.max(0,Number(state.incomes.groundMaintenanceQuarterly)||0);return Math.max(0,(Number(state.incomes.rent)||0)-(quarterly/3))}
function groundMaintenanceMonthly(){return Math.max(0,Number(state.incomes.groundMaintenanceQuarterly)||0)/3}
function monthlyBillAmount(b){const n=Number(b.amount)||0;return b.frequency==='weekly'?n*52/12:b.frequency==='quarterly'?n/3:b.frequency==='annually'?n/12:n}
function splitData(m=document.getElementById('monthPicker')?.value||monthISO()){
 const inc=state.incomes||{},netRent=Math.max(0,rentalNet()),me=Math.max(0,Number(inc.me)||0),partner=Math.max(0,Number(inc.partner)||0);
 const salaryPot=me+partner,mePct=salaryPot>0?me/salaryPot:0.5,partnerPct=1-mePct;
 const billsGross=state.bills.filter(b=>b.active!==false).reduce((s,b)=>s+monthlyBillAmount(b),0);
 const personalBillTotals={me:0,partner:0};state.personalBills.filter(b=>b.active!==false).forEach(b=>{personalBillTotals[b.person==='partner'?'partner':'me']+=monthlyBillAmount(b)});
 // Net rent is applied directly to the recurring bills because it is received into the account that pays them.
 const rentApplied=Math.min(netRent,billsGross),billBalance=Math.max(0,billsGross-netRent);
 const tx=monthTx(m),groceries=tx.filter(t=>t.type==='expense'&&t.category==='Groceries'&&t.scope!=='personal');
 const groceryBudget=500;
 // Fixed arrangement: the wife manages and pays the full £500 monthly grocery budget.
 // Individual grocery transactions are not needed for the settlement calculation.
 const grocerySpent=500,groceryPaidByPartner=500;
 const personalExpenses=tx.filter(t=>t.type==='expense'&&t.scope==='personal');
 const mePersonalSpent=total(personalExpenses.filter(t=>t.person===state.people[0]));
 const partnerPersonalSpent=total(personalExpenses.filter(t=>t.person===state.people[1]));
 const mePersonalBudget=(state.personalBudgets?.me||[]).reduce((s,b)=>s+Number(b.budget||0),0),partnerPersonalBudget=(state.personalBudgets?.partner||[]).reduce((s,b)=>s+Number(b.budget||0),0);
 const partnerBillShare=billBalance*partnerPct,partnerGroceryShare=grocerySpent*partnerPct;
 const partnerTransfers=Math.max(0,Number(state.reimbursements[m])||0);
 // Wife pays the full fixed £500 grocery bill. Only her percentage share is her cost;
 // the amount above her share is a credit against what she owes for the household bills.
 const wifeGroceryCredit=Math.max(0,groceryPaidByPartner-partnerGroceryShare);
 const partnerOwes=partnerBillShare-wifeGroceryCredit-partnerTransfers;
 const meBillShare=billBalance*mePct,meGroceryShare=grocerySpent*mePct;
 const meDisposable=me-meBillShare-meGroceryShare-personalBillTotals.me-mePersonalSpent;
 const partnerDisposable=partner-partnerBillShare-partnerGroceryShare-personalBillTotals.partner-partnerPersonalSpent;
 return {netRent,me,partner,salaryPot,mePct,partnerPct,billsGross,rentApplied,billBalance,grocerySpent,groceryBudget,groceryLeft:groceryBudget-grocerySpent,groceryPaidByPartner,partnerBillShare,partnerGroceryShare,partnerTransfers,wifeGroceryCredit,partnerOwes,meBillShare,meGroceryShare,totalShared:billBalance+grocerySpent,mePersonalSpent,partnerPersonalSpent,mePersonalBudget,partnerPersonalBudget,personalBillTotals,meDisposable,partnerDisposable};
}

function openPersonalBillModal(index=null){const old=index===null?null:state.personalBills[index];document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" id="pbBackdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>${old?'Edit personal bill':'Add personal recurring bill'}</h2><button class="close-btn" id="pbClose">×</button></div><form id="pbForm"><div class="field"><label for="pbName">Bill name</label><input id="pbName" maxlength="80" required placeholder="e.g. Car finance" value="${esc(old?.name||'')}"></div><div class="field"><label for="pbPerson">Whose bill is it?</label><select id="pbPerson"><option value="me" ${(old?.person||'me')==='me'?'selected':''}>${esc(state.people[0]||'You')}</option><option value="partner" ${old?.person==='partner'?'selected':''}>${esc(state.people[1]||'Your wife')}</option></select></div><div class="field"><label for="pbAmount">Amount (£)</label><input id="pbAmount" type="number" min="0.01" step="0.01" required value="${old?Number(old.amount):''}"></div><div class="field"><label for="pbFrequency">How often is it paid?</label><select id="pbFrequency">${[['monthly','Monthly'],['weekly','Weekly'],['quarterly','Quarterly'],['annually','Annually']].map(([v,l])=>`<option value="${v}" ${(old?.frequency||'monthly')===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label><input id="pbActive" type="checkbox" ${old?.active===false?'':'checked'} style="width:auto;min-height:auto;margin-right:8px">Include this bill in disposable income</label></div><div class="modal-actions">${old?'<button class="danger" type="button" id="pbDelete">Delete</button>':''}<button class="secondary" type="button" id="pbCancel">Cancel</button><button class="primary" type="submit">Save bill</button></div></form></div></div>`;const close=()=>document.getElementById('modalRoot').innerHTML='';document.getElementById('pbClose').onclick=close;document.getElementById('pbCancel').onclick=close;document.getElementById('pbBackdrop').onclick=e=>{if(e.target.id==='pbBackdrop')close()};document.getElementById('pbForm').onsubmit=e=>{e.preventDefault();const item={name:document.getElementById('pbName').value.trim(),person:document.getElementById('pbPerson').value,amount:Number(document.getElementById('pbAmount').value),frequency:document.getElementById('pbFrequency').value,active:document.getElementById('pbActive').checked};if(!item.name||item.amount<=0)return;if(old)state.personalBills[index]=item;else state.personalBills.push(item);save();close();render()};if(old)document.getElementById('pbDelete').onclick=()=>{if(confirm(`Delete personal bill “${old.name}”?`)){state.personalBills.splice(index,1);save();close();render()}}}

function settingsPage(){return `<h1 class="page-title">Settings & backup</h1><p class="subtext">Manage your household profile and protect your records.</p><div class="card hero-card"><div class="settings-block"><h3>Household members</h3><p class="subtext">Choose names to show beside transactions.</p>${state.people.map((p,i)=>`<div class="setting-line"><div><strong>${esc(p)}</strong><small>Household member ${i+1}</small></div><button class="secondary" data-personedit="${i}">Rename</button></div>`).join('')}<button class="secondary" id="addPerson" style="width:100%;margin-top:10px">＋ Add household member</button></div><div class="settings-block"><h3>Backup and export</h3><p class="subtext">Your records are saved in this browser on this device. Export backups regularly.</p><div class="setting-line"><div><strong>Export backup</strong><small>Save transactions, budgets, income settings and recurring bills as a JSON file.</small></div><button class="primary" id="exportJson">Export</button></div><div class="setting-line"><div><strong>Export spreadsheet</strong><small>Download transactions as a CSV file.</small></div><button class="secondary" id="exportCsv">CSV</button></div><div class="setting-line"><div><strong>Restore backup</strong><small>Load a JSON backup you exported previously.</small></div><button class="secondary" id="importJson">Import</button></div><input type="file" id="importFile" accept=".json,application/json" class="hidden"></div><div class="settings-block"><h3>Privacy and storage</h3><div class="notice">This version stores information locally in this browser. It does not send your transactions to a server. Other devices will not automatically receive your changes. Anyone with access to this browser profile may be able to open the app.</div><div class="setting-line"><div><strong>Clear all app data</strong><small>Permanently remove saved transactions, members and budgets from this device.</small></div><button class="danger" id="clearData">Clear</button></div></div><div class="settings-block"><h3>About</h3><div class="setting-line"><div><strong>Household Expense Tracker</strong><small>Version 1.5 · Household summary and personal recurring bills · GBP (£)</small></div><span class="pill">MVP</span></div></div></div>`}
function bindDynamic(){document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>setPage(b.dataset.goto));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openTxModal(b.dataset.edit));document.querySelectorAll('[data-budget]').forEach(inp=>inp.onchange=()=>{const c=cat(inp.dataset.budget);c.budget=Math.max(0,Number(inp.value)||0);save();render()});document.querySelectorAll('[data-editcat]').forEach(b=>b.onclick=()=>openCategoryModal(b.dataset.editcat));const qs=id=>document.getElementById(id);if(qs('txSearch'))qs('txSearch').oninput=e=>{filters.search=e.target.value;const pos=e.target.selectionStart;render();const el=qs('txSearch');el.focus();el.setSelectionRange(pos,pos)};if(qs('txType'))qs('txType').onchange=e=>{filters.type=e.target.value;render()};if(qs('txCategory'))qs('txCategory').onchange=e=>{filters.category=e.target.value;render()};if(qs('txPerson'))qs('txPerson').onchange=e=>{filters.person=e.target.value;render()};if(qs('incomeForm'))qs('incomeForm').onsubmit=e=>{e.preventDefault();state.incomes={...state.incomes,me:Math.max(0,Number(qs('incomeMe').value)||0),partner:Math.max(0,Number(qs('incomePartner').value)||0),rent:Math.max(0,Number(qs('rentGross').value)||0),groundMaintenanceQuarterly:Math.max(0,Number(qs('propertyCosts').value)||0)};save();render()};document.querySelectorAll('[data-pbudgetedit]').forEach(b=>b.onclick=()=>openPersonalBudgetModal(page==='wife'?'partner':'me',Number(b.dataset.pbudgetedit)));document.querySelectorAll('[data-pbudgetdelete]').forEach(b=>b.onclick=()=>{const key=page==='wife'?'partner':'me',i=Number(b.dataset.pbudgetdelete);if(confirm(`Delete personal budget “${state.personalBudgets[key][i].name}”?`)){state.personalBudgets[key].splice(i,1);save();render()}});if(qs('addPersonalBudget'))qs('addPersonalBudget').onclick=()=>openPersonalBudgetModal(page==='wife'?'partner':'me');if(qs('saveSettlement'))qs('saveSettlement').onclick=()=>{const m=qs('monthPicker').value||monthISO();state.reimbursements[m]=Math.max(0,Number(qs('partnerTransfer').value)||0);save();render()};if(qs('addBill'))qs('addBill').onclick=()=>openBillModal();if(qs('addPersonalBill'))qs('addPersonalBill').onclick=()=>openPersonalBillModal();document.querySelectorAll('[data-pbedit]').forEach(b=>b.onclick=()=>openPersonalBillModal(Number(b.dataset.pbedit)));document.querySelectorAll('[data-pbdelete]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.pbdelete);if(confirm(`Delete personal bill “${state.personalBills[i].name}”?`)){state.personalBills.splice(i,1);save();render()}});document.querySelectorAll('[data-billedit]').forEach(b=>b.onclick=()=>openBillModal(Number(b.dataset.billedit)));document.querySelectorAll('[data-billdelete]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.billdelete);if(confirm(`Delete recurring bill “${state.bills[i].name}”?`)){state.bills.splice(i,1);save();render()}});if(qs('addCategory'))qs('addCategory').onclick=()=>openCategoryModal();if(qs('addPerson'))qs('addPerson').onclick=()=>renamePerson(-1);if(qs('exportJson'))qs('exportJson').onclick=exportJson;if(qs('exportCsv'))qs('exportCsv').onclick=exportCsv;if(qs('importJson'))qs('importJson').onclick=()=>qs('importFile').click();if(qs('importFile'))qs('importFile').onchange=importJson;if(qs('clearData'))qs('clearData').onclick=clearData;document.querySelectorAll('[data-personedit]').forEach(b=>b.onclick=()=>renamePerson(Number(b.dataset.personedit)))}
function openTxModal(id=null){editingId=id;const t=id?state.transactions.find(x=>x.id===id):null;const cats=state.categories.map(c=>`<option ${t?.category===c.name?'selected':''}>${esc(c.name)}</option>`).join('');const people=state.people.map(p=>`<option ${t?.person===p?'selected':''}>${esc(p)}</option>`).join('');document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" id="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">${t?'Edit transaction':'Add transaction'}</h2><button class="close-btn" id="closeModal" aria-label="Close">×</button></div><form id="txForm"><div class="field"><label>Type</label><select id="fType"><option value="expense" ${t?.type!=='income'?'selected':''}>Expense</option><option value="income" ${t?.type==='income'?'selected':''}>Income</option></select></div><div class="form-grid"><div class="field"><label for="fAmount">Amount (£)</label><input id="fAmount" type="number" min="0.01" max="100000000" step="0.01" placeholder="0.00" required value="${t?Number(t.amount):''}"></div><div class="field"><label for="fDate">Date</label><input id="fDate" type="date" required value="${t?.date||todayISO()}"></div></div><div class="field"><label for="fDesc">Description</label><input id="fDesc" maxlength="100" placeholder="e.g. Weekly shop" required value="${esc(t?.description||'')}"></div><div class="form-grid"><div class="field"><label for="fCat">Category</label><select id="fCat">${cats}</select></div><div class="field"><label for="fPerson">Paid by / received by</label><select id="fPerson">${people}</select></div></div><div class="field"><label for="fScope">Expense type</label><select id="fScope"><option value="personal" ${(t?.scope||(((t?.category||state.categories[0]?.name)==='Groceries'||(t?.category||state.categories[0]?.name)==='Household bills')?'shared':'personal'))==='personal'?'selected':''}>Personal — my own spending</option><option value="shared" ${(t?.scope||(((t?.category||state.categories[0]?.name)==='Groceries'||(t?.category||state.categories[0]?.name)==='Household bills')?'shared':'personal'))==='shared'?'selected':''}>Shared household</option></select><small class="tiny">Shared grocery purchases count towards the £500 budget and settlement. Personal purchases stay separate.</small></div><div class="field"><label for="fMethod">Payment method (optional)</label><select id="fMethod"><option value="">Not specified</option>${['Debit card','Credit card','Cash','Direct debit','Bank transfer','Other'].map(x=>`<option ${t?.method===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="fNotes">Notes (optional)</label><textarea id="fNotes" maxlength="500" placeholder="Any useful details">${esc(t?.notes||'')}</textarea></div><div class="modal-actions">${t?'<button type="button" class="danger" id="deleteTx">Delete</button>':''}<button class="primary" type="submit">${t?'Save changes':'Save transaction'}</button></div></form></div></div>`;const close=()=>document.getElementById('modalRoot').innerHTML='';document.getElementById('closeModal').onclick=close;document.getElementById('backdrop').onclick=e=>{if(e.target.id==='backdrop')close()};document.getElementById('fCat').onchange=()=>{const c=document.getElementById('fCat').value;if(c==='Groceries'||c==='Household bills')document.getElementById('fScope').value='shared'};document.getElementById('txForm').onsubmit=e=>{e.preventDefault();const amount=Number(document.getElementById('fAmount').value);if(!Number.isFinite(amount)||amount<=0){alert('Enter an amount greater than zero.');return}const old=t||{};const item={id:old.id||crypto.randomUUID?.()||String(Date.now()),type:document.getElementById('fType').value,amount:Math.round(amount*100)/100,date:document.getElementById('fDate').value,description:document.getElementById('fDesc').value.trim(),category:document.getElementById('fCat').value,scope:document.getElementById('fScope').value,person:document.getElementById('fPerson').value,method:document.getElementById('fMethod').value,notes:document.getElementById('fNotes').value.trim(),createdAt:old.createdAt||Date.now()};if(!item.description||!item.date){alert('Please complete the description and date.');return}if(t)state.transactions=state.transactions.map(x=>x.id===t.id?item:x);else state.transactions.push(item);save();document.getElementById('monthPicker').value=item.date.slice(0,7);close();render()};if(t)document.getElementById('deleteTx').onclick=()=>{if(confirm(`Delete “${t.description}” (${money(t.amount)})?`)){state.transactions=state.transactions.filter(x=>x.id!==t.id);save();close();render()}};setTimeout(()=>document.getElementById('fAmount')?.focus(),60)}
function openPersonalBudgetModal(who,idx=null){const key=who,arr=state.personalBudgets[key]||[],old=idx!==null?arr[idx]:null;document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" id="backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>${old?'Edit budget':'Add personal budget'}</h2><button class="close-btn" id="closeModal">×</button></div><form id="pBudgetForm"><div class="field"><label>Budget name</label><input id="pBudgetName" maxlength="32" required value="${esc(old?.name||'')}" placeholder="e.g. Holidays"></div><div class="form-grid"><div class="field"><label>Icon</label><input id="pBudgetIcon" maxlength="8" value="${esc(old?.icon||'🎯')}"></div><div class="field"><label>Monthly budget (£)</label><input id="pBudgetAmount" type="number" min="0" step="10" value="${Number(old?.budget)||0}"></div></div><div class="modal-actions">${old?'<button type="button" class="danger" id="deletePBudget">Delete</button>':''}<button class="primary" type="submit">Save budget</button></div></form></div></div>`;const close=()=>document.getElementById('modalRoot').innerHTML='';document.getElementById('closeModal').onclick=close;document.getElementById('backdrop').onclick=e=>{if(e.target.id==='backdrop')close()};document.getElementById('pBudgetForm').onsubmit=e=>{e.preventDefault();const name=document.getElementById('pBudgetName').value.trim();if(!name)return;const item={id:old?.id||crypto.randomUUID?.()||String(Date.now()),name,icon:document.getElementById('pBudgetIcon').value.trim()||'🎯',budget:Math.max(0,Number(document.getElementById('pBudgetAmount').value)||0)};if(arr.some((x,i)=>x.name.toLowerCase()===name.toLowerCase()&&i!==idx)){alert('A budget with that name already exists for this person.');return}if(old)arr[idx]=item;else arr.push(item);state.personalBudgets[key]=arr;save();close();render()};if(old)document.getElementById('deletePBudget').onclick=()=>{if(confirm(`Delete personal budget “${old.name}”?`)){arr.splice(idx,1);save();close();render()}}}

function openCategoryModal(name=''){const old=name?cat(name):null;document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" id="backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>${old?'Edit category':'Add category'}</h2><button class="close-btn" id="closeModal">×</button></div><form id="catForm"><div class="field"><label>Category name</label><input id="catName" maxlength="32" required value="${esc(old?.name||'')}" placeholder="e.g. Holidays"></div><div class="form-grid"><div class="field"><label>Icon (emoji)</label><input id="catIcon" maxlength="8" value="${esc(old?.icon||'✨')}"></div><div class="field"><label>Monthly budget (£)</label><input id="catBudget" type="number" min="0" step="10" value="${Number(old?.budget)||0}"></div></div><div class="modal-actions">${old?'<button type="button" class="danger" id="deleteCat">Delete</button>':''}<button class="primary" type="submit">Save category</button></div></form></div></div>`;const close=()=>document.getElementById('modalRoot').innerHTML='';document.getElementById('closeModal').onclick=close;document.getElementById('backdrop').onclick=e=>{if(e.target.id==='backdrop')close()};document.getElementById('catForm').onsubmit=e=>{e.preventDefault();const newName=document.getElementById('catName').value.trim();if(!newName)return;if(state.categories.some(c=>c.name.toLowerCase()===newName.toLowerCase()&&c.name!==name)){alert('A category with that name already exists.');return}if(old){state.categories=state.categories.map(c=>c.name===name?{...c,name:newName,icon:document.getElementById('catIcon').value||'✨',budget:Math.max(0,Number(document.getElementById('catBudget').value)||0)}:c);state.transactions.forEach(t=>{if(t.category===name)t.category=newName})}else state.categories.push({name:newName,icon:document.getElementById('catIcon').value||'✨',color:'#e8f1f0',budget:Math.max(0,Number(document.getElementById('catBudget').value)||0)});save();close();render()};if(old)document.getElementById('deleteCat').onclick=()=>{if(state.transactions.some(t=>t.category===name)){alert('This category has transactions. Edit those transactions to another category before deleting it.');return}if(confirm(`Delete category “${name}”?`)){state.categories=state.categories.filter(c=>c.name!==name);save();close();render()}}}
function renamePerson(i){const old=i<0?'':state.people[i];const name=prompt(i<0?'Name for the new household member:':'Rename household member:',old);if(name===null)return;const v=name.trim();if(!v){alert('Please enter a name.');return}if(state.people.some((p,j)=>p.toLowerCase()===v.toLowerCase()&&j!==i)){alert('That name is already in use.');return}if(i<0)state.people.push(v);else{state.people[i]=v;state.transactions.forEach(t=>{if(t.person===old)t.person=v})}save();render()}
function download(filename,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJson(){download(`household-tracker-backup-${todayISO()}.json`,JSON.stringify(state,null,2),'application/json')}
function exportCsv(){const rows=[['Date','Type','Description','Category','Amount GBP','Paid by / received by','Payment method','Notes'],...state.transactions.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.type,t.description,t.category,Number(t.amount).toFixed(2),t.person,t.method||'',t.notes||''])];const csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download(`household-transactions-${todayISO()}.csv`,'\ufeff'+csv,'text/csv;charset=utf-8')}
function importJson(e){const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const v=JSON.parse(reader.result);if((v.version!==1&&v.version!==2&&v.version!==3&&v.version!==4&&v.version!==5)||!Array.isArray(v.transactions)||!Array.isArray(v.categories)||!Array.isArray(v.people))throw new Error('This does not look like a Household Tracker backup.');if(!confirm(`Restore backup with ${v.transactions.length} transactions? This replaces the data currently saved in this browser.`))return;state={version:5,people:v.people,categories:v.categories,transactions:v.transactions,budgetsMonth:v.budgetsMonth||monthISO(),incomes:(()=>{const x=v.incomes||{};return {me:Number(x.me)||0,partner:Number(x.partner)||0,rent:Number(x.rent)||0,groundMaintenanceQuarterly:x.groundMaintenanceQuarterly!=null?Number(x.groundMaintenanceQuarterly)||0:Math.max(0,Number(x.propertyCosts)||0)*3}})(),bills:Array.isArray(v.bills)?v.bills:[],personalBills:Array.isArray(v.personalBills)?v.personalBills:[],groceryBudget:500,reimbursements:v.reimbursements&&typeof v.reimbursements==='object'?v.reimbursements:{},personalBudgets:(()=>{const defaults=v.categories.filter(c=>c.name!=='Groceries'&&c.name!=='Household bills').map((c,i)=>({id:'b'+i,name:c.name,icon:c.icon||'✳️',budget:Number(c.budget)||0}));const pb=v.personalBudgets&&typeof v.personalBudgets==='object'?v.personalBudgets:{};return {me:Array.isArray(pb.me)?pb.me:defaults.map(x=>({...x})),partner:Array.isArray(pb.partner)?pb.partner:defaults.map(x=>({...x}))}})()};state.transactions.forEach(t=>{if(!t.scope)t.scope=t.category==='Groceries'||t.category==='Household bills'?'shared':'personal'});const gc=state.categories.find(c=>c.name==='Groceries');if(gc&&gc.budget===450)gc.budget=state.groceryBudget;save();render();alert('Backup restored.')}catch(err){alert('Could not restore backup: '+err.message)}finally{e.target.value=''}};reader.readAsText(file)}
function clearData(){if(!confirm('This permanently deletes all transactions, categories and household members saved by this app on this device. Export a backup first if you may need these records. Continue?'))return;if(!confirm('Final confirmation: clear all Household Tracker data?'))return;state=initial();save();render()}
document.getElementById('fab').onclick=()=>openTxModal();document.getElementById('headerAdd').onclick=()=>openTxModal();document.getElementById('monthPicker').value=monthISO();document.getElementById('monthPicker').onchange=()=>{updateHeader();render()};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
})();
</script>
</body></html>
